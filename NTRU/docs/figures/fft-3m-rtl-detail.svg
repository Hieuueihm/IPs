<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1080" viewBox="0 0 1900 1080"><title>Explicit complex FFT/IFFT datapath with keep operands and 3M context</title><rect width="100%" height="100%" fill="white"/><text x="55" y="42" text-anchor="start" dominant-baseline="central" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#20334a">FFT / IFFT: EXPLICIT PRE-ADDS, KEEP PATH AND 3M COLLECTOR</text><text x="55" y="80" text-anchor="start" dominant-baseline="central" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#586878">W = 32 / 64 / 128 per real component. Every wrap and rounding follows the selected fixed-point contract.</text><polygon points="55,140 375,140 375,270 55,270" fill="#f1f5f9" stroke="#324c65" stroke-width="2"/><text x="215.0" y="175.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#20334a">INPUT CONTEXT</text><text x="215.0" y="206.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#20334a">Ar, Ai, Br, Bi, wr, wi</text><text x="215.0" y="237.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#20334a">op / ctx / lane / destinations</text><polygon points="445,140 1055,140 1055,270 445,270" fill="#eef4fb" stroke="#324c65" stroke-width="2"/><text x="750.0" y="175.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#17599d">BUTTERFLY PREP / OPERAND SELECT</text><text x="750.0" y="206.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#17599d">FFT: X = B, Y = w, K = A</text><text x="750.0" y="237.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#17599d">IFFT: X = wrap(A-B), Y = conjugate(w), K = wrap(A+B)</text><polyline points="375,205 445,205" fill="none" stroke="#324c65" stroke-width="3"/><polygon points="445,205 435.9955289764732,209.3496553411123 435.9955289764732,200.6503446588877" fill="#324c65" stroke="#324c65" stroke-width="2"/><polygon points="1110,155 1185,155 1185,255 1110,255" fill="#f1f5f9" stroke="#324c65" stroke-width="2"/><polyline points="1119,155 1119,255" fill="none" stroke="#324c65" stroke-width="2"/><polygon points="1140.5,255 1147.5,245 1154.5,255" fill="white" stroke="#324c65" stroke-width="2"/><text x="1147.5" y="205.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#20334a">Rxy</text><polyline points="1055,205 1110,205" fill="none" stroke="#324c65" stroke-width="3"/><polygon points="1110,205 1100.9955289764732,209.3496553411123 1100.9955289764732,200.6503446588877" fill="#324c65" stroke="#324c65" stroke-width="2"/><polygon points="1260,140 1835,140 1835,270 1260,270" fill="#f1f5f9" stroke="#324c65" stroke-width="2"/><text x="1547.5" y="175.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#20334a">KEEP-DATA / DESTINATION STORE</text><text x="1547.5" y="206.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#20334a">Kre, Kim, op, ctx_id, lane_id, dst0, dst1</text><text x="1547.5" y="237.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#20334a">Retain until corresponding product triplet retires</text><polyline points="815,270 815,305 1548,305 1548,270" fill="none" stroke="#77518b" stroke-width="3"/><polygon points="1548,270 1552.3496553411123,279.0044710235268 1543.6503446588877,279.0044710235268" fill="#77518b" stroke="#77518b" stroke-width="2"/><text x="1165" y="291" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#77518b">K + context</text><polygon points="55,380 390,380 390,525 55,525" fill="#eef4fb" stroke="#324c65" stroke-width="2"/><text x="222.5" y="422.5" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#17599d">REAL / IMAG OPERANDS</text><text x="222.5" y="453.5" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#17599d">Xr, Xi, Yr, Yi</text><text x="222.5" y="484.5" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#17599d">from Rxy</text><polyline points="1185,205 1220,205 1220,340 220,340 220,380" fill="none" stroke="#324c65" stroke-width="3"/><polygon points="220,380 215.6503446588877,370.9955289764732 224.3496553411123,370.9955289764732" fill="#324c65" stroke="#324c65" stroke-width="2"/><polygon points="445,385 790,385 790,520 445,520" fill="#eef4fb" stroke="#324c65" stroke-width="2"/><text x="617.5" y="422.5" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#17599d">3M PRE-ADDERS</text><text x="617.5" y="453.5" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#17599d">Sx = wrap_W(Xr + Xi)</text><text x="617.5" y="484.5" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#17599d">Sy = wrap_W(Yr + Yi)</text><polyline points="390,450 445,450" fill="none" stroke="#324c65" stroke-width="3"/><polygon points="445,450 435.9955289764732,454.3496553411123 435.9955289764732,445.6503446588877" fill="#324c65" stroke="#324c65" stroke-width="2"/><polygon points="850,365 1220,365 1220,560 850,560" fill="#f1f5f9" stroke="#324c65" stroke-width="2"/><text x="1035.0" y="402.5" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#20334a">PRODUCT SELECT / ISSUE</text><text x="1035.0" y="433.5" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#20334a">phase 0: Xr x Yr</text><text x="1035.0" y="464.5" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#20334a">phase 1: Xi x Yi</text><text x="1035.0" y="495.5" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#20334a">phase 2: Sx x Sy</text><text x="1035.0" y="526.5" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#20334a">tag = {ctx, lane, phase}</text><polyline points="790,450 850,450" fill="none" stroke="#324c65" stroke-width="3"/><polygon points="850,450 840.9955289764732,454.3496553411123 840.9955289764732,445.6503446588877" fill="#324c65" stroke="#324c65" stroke-width="2"/><polyline points="220,525 220,595 1035,595 1035,560" fill="none" stroke="#324c65" stroke-width="3"/><polygon points="1035,560 1039.3496553411123,569.0044710235268 1030.6503446588877,569.0044710235268" fill="#324c65" stroke="#324c65" stroke-width="2"/><text x="590" y="578" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#20334a">Xr / Xi / Yr / Yi bypass pre-adders</text><polygon points="1280,365 1550,365 1550,560 1280,560" fill="#eef4fb" stroke="#324c65" stroke-width="2"/><text x="1415.0" y="417.5" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#17599d">SHARED MULTIPLIERS</text><text x="1415.0" y="448.5" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#17599d">limb/sign routing</text><text x="1415.0" y="479.5" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#17599d">+ exact fusion</text><text x="1415.0" y="510.5" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#17599d">+ per-product rounding</text><polyline points="1220,462 1280,462" fill="none" stroke="#324c65" stroke-width="3"/><polygon points="1280,462 1270.9955289764732,466.3496553411123 1270.9955289764732,457.6503446588877" fill="#324c65" stroke="#324c65" stroke-width="2"/><polygon points="1610,365 1845,365 1845,560 1610,560" fill="#f1f5f9" stroke="#324c65" stroke-width="2"/><text x="1727.5" y="417.5" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#20334a">3M COLLECTOR</text><text x="1727.5" y="448.5" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#20334a">Rp0 / Rp1 / Rp2</text><text x="1727.5" y="479.5" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#20334a">per ctx + lane</text><text x="1727.5" y="510.5" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#20334a">valid triplet</text><polyline points="1550,462 1610,462" fill="none" stroke="#324c65" stroke-width="3"/><polygon points="1610,462 1600.9955289764732,466.3496553411123 1600.9955289764732,457.6503446588877" fill="#324c65" stroke="#324c65" stroke-width="2"/><polygon points="1280,670 1845,670 1845,800 1280,800" fill="#eef4fb" stroke="#324c65" stroke-width="2"/><text x="1562.5" y="705.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#17599d">COMPLEX COMBINE</text><text x="1562.5" y="736.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#17599d">Tre = wrap_W(p0 - p1)</text><text x="1562.5" y="767.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#17599d">Tim = wrap_W(p2 - p0 - p1)</text><polyline points="1727,560 1727,670" fill="none" stroke="#324c65" stroke-width="3"/><polygon points="1727,670 1722.6503446588877,660.9955289764732 1731.3496553411123,660.9955289764732" fill="#324c65" stroke="#324c65" stroke-width="2"/><polygon points="535,670 1135,670 1135,800 535,800" fill="#eef4fb" stroke="#324c65" stroke-width="2"/><text x="835.0" y="705.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#17599d">BUTTERFLY OUTPUT</text><text x="835.0" y="736.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#17599d">FFT: U = wrap(K+T), V = wrap(K-T)</text><text x="835.0" y="767.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#17599d">IFFT: U = K, V = T</text><polyline points="1280,735 1135,735" fill="none" stroke="#324c65" stroke-width="3"/><polygon points="1135,735 1144.0044710235268,730.6503446588877 1144.0044710235268,739.3496553411123" fill="#324c65" stroke="#324c65" stroke-width="2"/><polyline points="1740,270 1740,320 1570,320 1570,635 835,635 835,670" fill="none" stroke="#77518b" stroke-width="3"/><polygon points="835,670 830.6503446588877,660.9955289764732 839.3496553411123,660.9955289764732" fill="#77518b" stroke="#77518b" stroke-width="2"/><text x="1120" y="617" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#77518b">K / op / destination context</text><polygon points="55,670 380,670 380,800 55,800" fill="#eef4fb" stroke="#324c65" stroke-width="2"/><text x="217.5" y="705.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#17599d">FINAL IFFT SCALE ONLY</text><text x="217.5" y="736.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#17599d">wrap_W(x + bias) &gt;&gt;&gt; s</text><text x="217.5" y="767.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#17599d">s = logN - 1</text><polyline points="535,735 380,735" fill="none" stroke="#324c65" stroke-width="3"/><polygon points="380,735 389.0044710235268,730.6503446588877 389.0044710235268,739.3496553411123" fill="#324c65" stroke="#324c65" stroke-width="2"/><polygon points="55,875 1845,875 1845,960 55,960" fill="#f1f5f9" stroke="#324c65" stroke-width="2"/><text x="950.0" y="917.5" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#20334a">WRITE-BACK PACKET: results + addresses + masks + context; stage barrier waits for committed writes</text><polyline points="217,800 217,875" fill="none" stroke="#324c65" stroke-width="3"/><polygon points="217,875 212.6503446588877,865.9955289764732 221.3496553411123,865.9955289764732" fill="#324c65" stroke="#324c65" stroke-width="2"/><text x="55" y="1005" text-anchor="start" dominant-baseline="central" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#20334a">Rounding is applied to EACH real product before the 3M combine. Pre-adds wrap at W; widening them changes this contract.</text><text x="55" y="1043" text-anchor="start" dominant-baseline="central" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#586878">The scale block is bypassed for FFT and for non-final IFFT stages. Other polynomial kernels reuse parts of this datapath.</text></svg>