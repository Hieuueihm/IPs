<polyline points="1005,397 1080,397" fill="none" stroke="#52677c" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="1305,397 1320,397 1320,500 310,500 310,295" fill="none" stroke="#52677c" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="40" y="540" width="1265" height="65" rx="6" fill="#edf1f5" stroke="#245b91" stroke-width="1.8"/>
<text x="672.5" y="577.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="normal" fill="#17324d">reserved_next = accepted_main_d OR (frontend_live AND NOT reserved AND main_request)</text>
<text x="680" y="320.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="normal" fill="#17324d">Cùng điều kiện accept được dùng cho trạng thái giữ chỗ.</text>
<text x="35" y="640.0" text-anchor="start" font-family="Arial, sans-serif" font-size="13" font-weight="normal" fill="#17324d">Theo RTL hiện tại • ADD/MUX/cổng: logic tổ hợp • D/Q: thanh ghi • RAM/DSP: primitive phần cứng.</text>
</svg>