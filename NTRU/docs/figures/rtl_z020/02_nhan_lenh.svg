<rect width="1360" height="660" fill="white"/>
<text x="35" y="38.0" text-anchor="start" font-family="Arial, sans-serif" font-size="25" font-weight="bold" fill="#17324d">2. Giữ chỗ và pipeline lệnh</text>
<text x="35" y="72.0" text-anchor="start" font-family="Arial, sans-serif" font-size="16" font-weight="normal" fill="#17324d">Đường giữ chỗ cho cfg/start/load/read; root và descriptor dùng các cờ riêng.</text>
<text x="950" y="105.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#17324d">334-bit payload clock qua P → Q mỗi chu kỳ; token xác định gói hợp lệ.</text>
<rect x="35" y="140" width="245" height="105" rx="6" fill="#fff2cc" stroke="#245b91" stroke-width="1.8"/>
