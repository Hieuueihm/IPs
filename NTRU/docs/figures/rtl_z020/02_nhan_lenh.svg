<text x="157.5" y="197.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#17324d">cfg/start &gt; load &gt; read</text>
<text x="157.5" y="218.58" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#17324d">→ main_request</text>
