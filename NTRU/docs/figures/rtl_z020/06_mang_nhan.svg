<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="690" viewBox="0 0 1360 690">
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#52677c"/></marker></defs>
<rect width="1360" height="690" fill="white"/>
<text x="35" y="38.0" text-anchor="start" font-family="Arial, sans-serif" font-size="25" font-weight="bold" fill="#17324d">6. Mảng nhân trong mỗi tile</text>
<text x="35" y="72.0" text-anchor="start" font-family="Arial, sans-serif" font-size="16" font-weight="normal" fill="#17324d">4 lá 16×16 dùng chung FFT / NTT; mỗi lá suy diễn thành một DSP48E1.</text>
<rect x="35" y="135" width="205" height="100" rx="6" fill="#fff2cc" stroke="#245b91" stroke-width="1.8"/>
<text x="137.5" y="179.46" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#17324d">Chọn toán hạng</text>
<text x="137.5" y="200.54000000000002" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#17324d">la/lb và lsa/lsb</text>
<rect x="300" y="135" width="220" height="100" rx="6" fill="#edf1f5" stroke="#245b91" stroke-width="1.8"/>
<text x="410.0" y="179.46" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#17324d">ar/br: 16 bit</text>
<text x="410.0" y="200.54000000000002" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#17324d">sar/sbr: 1 bit</text>
<path d="M300 213 l12 8 l-12 8" fill="none" stroke="#245b91" stroke-width="1.5"/>
<text x="312" y="155.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="normal" fill="#17324d">D</text>
<text x="507" y="155.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="normal" fill="#17324d">Q</text>
<polyline points="240,185 300,185" fill="none" stroke="#52677c" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="610" y="120" width="290" height="125" rx="6" fill="#e5f3ed" stroke="#245b91" stroke-width="1.8"/>
<text x="755.0" y="166.42000000000002" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#17324d">Sign extension</text>
<text x="755.0" y="187.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#17324d">ax = {sar AND ar[15], ar}</text>
<text x="755.0" y="208.58" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#17324d">bx = {sbr AND br[15], br}</text>
<polyline points="520,185 610,185" fill="none" stroke="#52677c" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="990" y="125" width="325" height="115" rx="6" fill="#e5f3ed" stroke="#245b91" stroke-width="1.8"/>
<text x="1152.5" y="166.42000000000002" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#17324d">DSP48E1</text>
<text x="1152.5" y="187.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#17324d">nhân signed 17×17</text>
<text x="1152.5" y="208.58" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#17324d">đầu ra hữu ích 33 bit</text>
<polyline points="900,185 990,185" fill="none" stroke="#52677c" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="1000" y="340" width="300" height="100" rx="6" fill="#edf1f5" stroke="#245b91" stroke-width="1.8"/>
<text x="1150.0" y="384.46" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#17324d">pp[1] → pp[2]</text>
<text x="1150.0" y="405.53999999999996" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#17324d">2 tầng product FF</text>
<path d="M1000 418 l12 8 l-12 8" fill="none" stroke="#245b91" stroke-width="1.5"/>
<text x="1012" y="360.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="normal" fill="#17324d">D</text>
<text x="1287" y="360.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="normal" fill="#17324d">Q</text>
<polyline points="1152,240 1152,340" fill="none" stroke="#52677c" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="45" y="345" width="405" height="115" rx="6" fill="#edf1f5" stroke="#245b91" stroke-width="1.8"/>
<text x="247.5" y="386.42" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#17324d">Bốn kết quả: p0,p1,p2,p3</text>
<text x="247.5" y="407.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#17324d">cat = {p1, p0[31:0]}</text>
<text x="247.5" y="428.58000000000004" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#17324d">p2r, p3r và cat có thanh ghi</text>
<polyline points="1000,390 450,390" fill="none" stroke="#52677c" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="725" y="370.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#17324d">4 lá song song</text>
<rect x="575" y="515" width="690" height="90" rx="6" fill="#edf1f5" stroke="#245b91" stroke-width="1.8"/>
<text x="920.0" y="554.46" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#17324d">f = cat + (sign_extend(p2r) &lt;&lt; 16) + (sign_extend(p3r) &lt;&lt; 16)</text>
<text x="920.0" y="575.5400000000001" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#17324d">65 bit; thanh ghi kết quả fused</text>
<path d="M575 583 l12 8 l-12 8" fill="none" stroke="#245b91" stroke-width="1.5"/>
<text x="587" y="535.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="normal" fill="#17324d">D</text>
<text x="1252" y="535.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="normal" fill="#17324d">Q</text>
<polyline points="245,460 245,560 575,560" fill="none" stroke="#52677c" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="680" y="648.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#17324d">Packed16: lá 0 và 1 tính hai tích riêng; A của lá 2 và 3 được đưa về 0.</text>
<text x="35" y="670.0" text-anchor="start" font-family="Arial, sans-serif" font-size="13" font-weight="normal" fill="#17324d">Theo RTL hiện tại • ADD/MUX/cổng: logic tổ hợp • D/Q: thanh ghi • RAM/DSP: primitive phần cứng.</text>
</svg>