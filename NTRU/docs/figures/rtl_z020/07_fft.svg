<text x="35" y="680.0" text-anchor="start" font-family="Arial, sans-serif" font-size="13" font-weight="normal" fill="#17324d">Theo RTL hiện tại • ADD/MUX/cổng: logic tổ hợp • D/Q: thanh ghi • RAM/DSP: primitive phần cứng.</text>
