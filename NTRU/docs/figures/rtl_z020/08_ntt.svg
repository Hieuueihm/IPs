<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="750" viewBox="0 0 1360 750">
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#52677c"/></marker></defs>
<rect width="1360" height="750" fill="white"/>
<text x="35" y="38.0" text-anchor="start" font-family="Arial, sans-serif" font-size="25" font-weight="bold" fill="#17324d">8. Montgomery và butterfly NTT hiện tại</text>
<text x="35" y="72.0" text-anchor="start" font-family="Arial, sans-serif" font-size="16" font-weight="normal" fill="#17324d">NTT32: R=2³²; packed16: R=2¹⁶ và hai làn cắt carry độc lập.</text>
<rect x="30" y="130" width="210" height="105" rx="6" fill="#fff2cc" stroke="#245b91" stroke-width="1.8"/>
<text x="135.0" y="166.42000000000002" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#17324d">CT: A=y</text>
<text x="135.0" y="187.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#17324d">GS: A=(x−y) mod q</text>
<text x="135.0" y="208.58" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#17324d">B=root</text>
<rect x="300" y="130" width="220" height="105" rx="6" fill="#e5f3ed" stroke="#245b91" stroke-width="1.8"/>
<text x="410.0" y="176.96" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#17324d">Lượt 1 trên 4 lá</text>
<text x="410.0" y="198.04000000000002" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#17324d">T = A × B</text>
<rect x="580" y="130" width="235" height="105" rx="6" fill="#e5f3ed" stroke="#245b91" stroke-width="1.8"/>
<text x="697.5" y="166.42000000000002" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#17324d">Lượt 2 trên 4 lá</text>
<text x="697.5" y="187.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#17324d">m = T.low × q′</text>
<text x="697.5" y="208.58" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#17324d">chỉ giữ low</text>
<rect x="875" y="130" width="250" height="105" rx="6" fill="#e5f3ed" stroke="#245b91" stroke-width="1.8"/>
<text x="1000.0" y="176.96" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#17324d">Lượt 3 trên 4 lá</text>
<text x="1000.0" y="198.04000000000002" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#17324d">m × q</text>
<polyline points="240,182 300,182" fill="none" stroke="#52677c" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="520,182 580,182" fill="none" stroke="#52677c" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="815,182 875,182" fill="none" stroke="#52677c" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="900" y="340" width="390" height="110" rx="6" fill="#edf1f5" stroke="#245b91" stroke-width="1.8"/>
<text x="1095.0" y="378.92" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#17324d">u = T.high + (m q).high</text>
<text x="1095.0" y="400.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#17324d">+ [T.low khác 0]</text>
<text x="1095.0" y="421.08000000000004" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#17324d">33-bit register u32</text>
<path d="M900 428 l12 8 l-12 8" fill="none" stroke="#245b91" stroke-width="1.5"/>
<text x="912" y="360.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="normal" fill="#17324d">D</text>
<text x="1277" y="360.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="normal" fill="#17324d">Q</text>
<polyline points="1000,235 1000,340" fill="none" stroke="#52677c" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="410,235 410,285 1180,285 1180,340" fill="none" stroke="#52677c" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="745" y="266.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#17324d">delay T.high / NZ</text>
<rect x="435" y="340" width="365" height="110" rx="6" fill="#edf1f5" stroke="#245b91" stroke-width="1.8"/>
<text x="617.5" y="378.92" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#17324d">Trừ q theo nửa + MUX</text>
<text x="617.5" y="400.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#17324d">u ≥ q ? u−q : u</text>
<text x="617.5" y="421.08000000000004" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#17324d">32-bit register r32r</text>
<path d="M435 428 l12 8 l-12 8" fill="none" stroke="#245b91" stroke-width="1.5"/>
<text x="447" y="360.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="normal" fill="#17324d">D</text>
<text x="787" y="360.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="normal" fill="#17324d">Q</text>
<polyline points="900,395 800,395" fill="none" stroke="#52677c" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="35" y="340" width="305" height="110" rx="6" fill="#e5f3ed" stroke="#245b91" stroke-width="1.8"/>
<text x="187.5" y="378.92" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#17324d">CT: x+t, x−t mod q</text>
<text x="187.5" y="400.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#17324d">GS: half(side), t</text>
<text x="187.5" y="421.08000000000004" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#17324d">MUX pairing packed16</text>
<polyline points="435,395 340,395" fill="none" stroke="#52677c" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="50" y="540" width="1235" height="105" rx="6" fill="#edf1f5" stroke="#245b91" stroke-width="1.8"/>
<text x="667.5" y="573.94" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="normal" fill="#17324d">GS inverse: nhánh tổng chia 2 theo modulo q.</text>
<text x="667.5" y="597.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="normal" fill="#17324d">Root inverse đã chứa hệ số 1/2, nên nhánh nhân cũng được chuẩn hóa.</text>
<text x="667.5" y="621.0600000000001" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="normal" fill="#17324d">q′ = −q⁻¹ mod R; modulus phải có root phù hợp với N và hmin.</text>
<text x="35" y="730.0" text-anchor="start" font-family="Arial, sans-serif" font-size="13" font-weight="normal" fill="#17324d">Theo RTL hiện tại • ADD/MUX/cổng: logic tổ hợp • D/Q: thanh ghi • RAM/DSP: primitive phần cứng.</text>
</svg>