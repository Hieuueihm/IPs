<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1160" viewBox="0 0 1900 1160"><title>Shared tile and explicit CT/GS operand-retention paths</title><rect width="100%" height="100%" fill="white"/><text x="55" y="42" text-anchor="start" dominant-baseline="central" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#20334a">SHARED TILE: MULTIPLIER USE + EXPLICIT NTT OPERAND RETENTION</text><text x="55" y="80" text-anchor="start" dominant-baseline="central" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#586878">One tile has four physical 16x16 multipliers. Below: one butterfly unit and the two-layer tile arrangement.</text><polygon points="55,140 320,140 320,275 55,275" fill="#f1f5f9" stroke="#324c65" stroke-width="2"/><text x="187.5" y="177.5" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#20334a">INPUT REGISTER R0</text><text x="187.5" y="208.5" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#20334a">A, B, w, mode, q</text><text x="187.5" y="239.5" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#20334a">valid / context</text><polygon points="380,140 680,140 680,275 380,275" fill="#edf8f5" stroke="#324c65" stroke-width="2"/><text x="530.0" y="177.5" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#087c74">NTT PRE-ARITHMETIC</text><text x="530.0" y="208.5" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#087c74">D = subq(A,B)</text><text x="530.0" y="239.5" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#087c74">S = addq(A,B)</text><polyline points="320,207 380,207" fill="none" stroke="#324c65" stroke-width="3"/><polygon points="380,207 370.9955289764732,211.3496553411123 370.9955289764732,202.6503446588877" fill="#324c65" stroke="#324c65" stroke-width="2"/><polygon points="745,150 815,172 815,363 745,385" fill="#edf2f7" stroke="#324c65" stroke-width="2"/><text x="777.2" y="267.5" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#20334a">MUX</text><text x="780" y="402" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#20334a">CT: B / GS: D</text><text x="780" y="428" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#20334a">FFT: selected limb</text><polyline points="680,207 745,207" fill="none" stroke="#324c65" stroke-width="3"/><polygon points="745,207 735.9955289764732,211.3496553411123 735.9955289764732,202.6503446588877" fill="#324c65" stroke="#324c65" stroke-width="2"/><polyline points="320,247 345,247 345,345 745,345" fill="none" stroke="#324c65" stroke-width="3"/><polygon points="745,345 735.9955289764732,349.3496553411123 735.9955289764732,340.6503446588877" fill="#324c65" stroke="#324c65" stroke-width="2"/><text x="555" y="327" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#20334a">B / FFT limb</text><polygon points="880,165 1045,165 1045,255 880,255" fill="#eef4fb" stroke="#324c65" stroke-width="2"/><text x="962.5" y="195.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#17599d">M: 16 x 16</text><text x="962.5" y="226.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#17599d">sign selected</text><polyline points="815,267 845,267 845,210 880,210" fill="none" stroke="#324c65" stroke-width="3"/><polygon points="880,210 870.9955289764732,214.3496553411123 870.9955289764732,205.6503446588877" fill="#324c65" stroke="#324c65" stroke-width="2"/><polyline points="187,275 187,475 962,475 962,255" fill="none" stroke="#324c65" stroke-width="3"/><polygon points="962,255 966.3496553411123,264.0044710235268 957.6503446588877,264.0044710235268" fill="#324c65" stroke="#324c65" stroke-width="2"/><text x="565" y="458" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#20334a">w for NTT / other FFT limb</text><polygon points="1110,150 1385,150 1385,270 1110,270" fill="#edf8f5" stroke="#324c65" stroke-width="2"/><text x="1247.5" y="180.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#087c74">MONTGOMERY REDUCE</text><text x="1247.5" y="211.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#087c74">T = Mont(product,q)</text><text x="1247.5" y="242.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#087c74">NTT only</text><polyline points="1045,210 1110,210" fill="none" stroke="#324c65" stroke-width="3"/><polygon points="1110,210 1100.9955289764732,214.3496553411123 1100.9955289764732,205.6503446588877" fill="#324c65" stroke="#324c65" stroke-width="2"/><polygon points="1450,135 1845,135 1845,290 1450,290" fill="#edf8f5" stroke="#324c65" stroke-width="2"/><text x="1647.5" y="182.5" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#087c74">NTT OUTPUT COMBINE</text><text x="1647.5" y="213.5" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#087c74">CT: (addq(Ahold,T), subq(Ahold,T))</text><text x="1647.5" y="244.5" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#087c74">GS: (Shold, T)</text><polyline points="1385,210 1450,210" fill="none" stroke="#324c65" stroke-width="3"/><polygon points="1450,210 1440.9955289764732,214.3496553411123 1440.9955289764732,205.6503446588877" fill="#324c65" stroke="#324c65" stroke-width="2"/><polygon points="380,535 1060,535 1060,630 380,630" fill="#f1f5f9" stroke="#324c65" stroke-width="2"/><text x="720.0" y="567.5" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#20334a">SIDE-DATA REGISTER / ELASTIC ALIGNMENT</text><text x="720.0" y="598.5" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#20334a">Ahold = A for CT; Shold = S for GS; carry roots + context</text><polyline points="530,275 530,535" fill="none" stroke="#77518b" stroke-width="3"/><polygon points="530,535 525.6503446588877,525.9955289764732 534.3496553411123,525.9955289764732" fill="#77518b" stroke="#77518b" stroke-width="2"/><polyline points="320,167 345,167 345,582 380,582" fill="none" stroke="#77518b" stroke-width="3"/><polygon points="380,582 370.9955289764732,586.3496553411123 370.9955289764732,577.6503446588877" fill="#77518b" stroke="#77518b" stroke-width="2"/><polyline points="1060,582 1420,582 1420,250 1450,250" fill="none" stroke="#77518b" stroke-width="3"/><polygon points="1450,250 1440.9955289764732,254.3496553411123 1440.9955289764732,245.6503446588877" fill="#77518b" stroke="#77518b" stroke-width="2"/><text x="1255" y="563" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#77518b">Ahold / Shold</text><polygon points="1450,380 1845,380 1845,475 1450,475" fill="#eef4fb" stroke="#324c65" stroke-width="2"/><text x="1647.5" y="412.5" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#17599d">FFT RAW PRODUCT REGISTER</text><text x="1647.5" y="443.5" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#17599d">retain unrounded limb product</text><polyline points="1045,210 1080,210 1080,427 1450,427" fill="none" stroke="#324c65" stroke-width="3"/><polygon points="1450,427 1440.9955289764732,431.3496553411123 1440.9955289764732,422.6503446588877" fill="#324c65" stroke="#324c65" stroke-width="2"/><text x="1260" y="409" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#17599d">raw bypass: no Montgomery</text><polyline points="55,710 1845,710 1845,1000 55,1000 55,710" fill="none" stroke="#324c65" stroke-width="2" stroke-dasharray="8 6"/><polygon points="95,770 445,770 445,905 95,905" fill="#edf8f5" stroke="#324c65" stroke-width="2"/><text x="270.0" y="807.5" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#087c74">STAGE 0: M0 + M1</text><text x="270.0" y="838.5" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#087c74">two butterfly units</text><text x="270.0" y="869.5" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#087c74">CT roots: w0,w0 / GS: w1,w2</text><polygon points="495,780 580,780 580,895 495,895" fill="#f1f5f9" stroke="#324c65" stroke-width="2"/><polyline points="504,780 504,895" fill="none" stroke="#324c65" stroke-width="2"/><polygon points="530.5,895 537.5,885 544.5,895" fill="white" stroke="#324c65" stroke-width="2"/><text x="537.5" y="837.5" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#20334a">Rmid</text><polyline points="445,837 495,837" fill="none" stroke="#324c65" stroke-width="3"/><polygon points="495,837 485.9955289764732,841.3496553411123 485.9955289764732,832.6503446588877" fill="#324c65" stroke="#324c65" stroke-width="2"/><polygon points="655,770 1005,770 1005,905 655,905" fill="#edf8f5" stroke="#324c65" stroke-width="2"/><text x="830.0" y="807.5" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#087c74">STAGE 1: M2 + M3</text><text x="830.0" y="838.5" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#087c74">two butterfly units</text><text x="830.0" y="869.5" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#087c74">CT roots: w1,w2 / GS: w0,w0</text><polygon points="595,790 640,790 640,885 595,885" fill="#f1f5f9" stroke="#324c65" stroke-width="2"/><text x="617.5" y="837.5" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#20334a">SW</text><polyline points="580,837 595,837" fill="none" stroke="#324c65" stroke-width="3"/><polygon points="595,837 585.9955289764732,841.3496553411123 585.9955289764732,832.6503446588877" fill="#324c65" stroke="#324c65" stroke-width="2"/><polyline points="640,837 655,837" fill="none" stroke="#324c65" stroke-width="3"/><polygon points="655,837 645.9955289764732,841.3496553411123 645.9955289764732,832.6503446588877" fill="#324c65" stroke="#324c65" stroke-width="2"/><polygon points="1100,750 1170,772 1170,918 1100,940" fill="#edf2f7" stroke="#324c65" stroke-width="2"/><text x="1132.2" y="845.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#20334a">MUX</text><polyline points="1005,837 1100,795" fill="none" stroke="#324c65" stroke-width="3"/><polygon points="1100,795 1093.5232646315858,802.6191796781236 1090.0056882619815,794.6627569373519" fill="#324c65" stroke="#324c65" stroke-width="2"/><polyline points="580,870 615,870 615,960 1060,960 1060,895 1100,895" fill="none" stroke="#324c65" stroke-width="3"/><polygon points="1100,895 1090.9955289764732,899.3496553411123 1090.9955289764732,890.6503446588877" fill="#324c65" stroke="#324c65" stroke-width="2"/><text x="825" y="940" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#087c74">one-layer data bypass</text><polygon points="1250,785 1340,785 1340,900 1250,900" fill="#f1f5f9" stroke="#324c65" stroke-width="2"/><polyline points="1259,785 1259,900" fill="none" stroke="#324c65" stroke-width="2"/><polygon points="1288.0,900 1295.0,890 1302.0,900" fill="white" stroke="#324c65" stroke-width="2"/><text x="1295.0" y="842.5" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#20334a">Rout</text><polyline points="1170,845 1250,845" fill="none" stroke="#324c65" stroke-width="3"/><polygon points="1250,845 1240.9955289764732,849.3496553411123 1240.9955289764732,840.6503446588877" fill="#324c65" stroke="#324c65" stroke-width="2"/><polygon points="1420,770 1790,770 1790,905 1420,905" fill="#f1f5f9" stroke="#324c65" stroke-width="2"/><text x="1605.0" y="807.5" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#20334a">TILE OUTPUT</text><text x="1605.0" y="838.5" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#20334a">NTT one/two-layer coefficients</text><text x="1605.0" y="869.5" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#20334a">or FFT raw 32 x 32 result</text><polyline points="1340,842 1420,842" fill="none" stroke="#324c65" stroke-width="3"/><polygon points="1420,842 1410.9955289764732,846.3496553411123 1410.9955289764732,837.6503446588877" fill="#324c65" stroke="#324c65" stroke-width="2"/><text x="950" y="737" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#20334a">TWO-LAYER TILE / ROOT SELECTION / LATENCY-MATCHED BYPASS</text><text x="55" y="1050" text-anchor="start" dominant-baseline="central" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#20334a">NTT intermediate coefficients stay in Rmid. Roots, mode and context must advance/stall with their corresponding data.</text><text x="55" y="1092" text-anchor="start" dominant-baseline="central" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#20334a">FFT uses M0/M1 for diagonal and M2/M3 for cross limb products; raw products are fused without intermediate rounding.</text><text x="55" y="1132" text-anchor="start" dominant-baseline="central" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#586878">SW = interstage lane permutation; w is Montgomery-encoded. Side paths use matched valid/ready; pipeline depths remain open.</text></svg>